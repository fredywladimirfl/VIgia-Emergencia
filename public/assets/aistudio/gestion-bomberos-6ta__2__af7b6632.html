<style>
:root{--bg:#eceff2;--card:#fff;--ink:#14202e;--mut:#5b6877;--line:#d5dbe2;--navy:#16263d;--pri:#c8102e;--red:#c8102e;--amb:#8f5400;--ok:#17703f;--br:#fde8eb;--ba:#fff0d1;--bo:#dff3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#172230;--ink:#e8edf2;--mut:#9aa8b8;--line:#2a3a4d;--navy:#0a121c;--red:#ff6b7d;--amb:#f2b04d;--ok:#5fd39a;--br:#3a1a22;--ba:#3a2e14;--bo:#15301f}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#172230;--ink:#e8edf2;--mut:#9aa8b8;--line:#2a3a4d;--navy:#0a121c;--red:#ff6b7d;--amb:#f2b04d;--ok:#5fd39a;--br:#3a1a22;--ba:#3a2e14;--bo:#15301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif}
.top{background:var(--navy);color:#fff;padding:.9rem 1.2rem;display:flex;flex-wrap:wrap;gap:.8rem;justify-content:space-between;align-items:center;border-bottom:4px solid var(--pri)}
h1{font:700 28px/1 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.01em}.corner{text-align:right}.cb{display:flex;gap:.7rem;align-items:center;justify-content:flex-end}.cb img{height:64px;width:auto;flex:none}.corner b{font:700 22px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.01em}.tools{margin-top:.5rem}.brand{display:flex;gap:.8rem;align-items:center}.brand img{border-radius:50%;flex:none}.top p{margin:.2rem 0 0;opacity:.75;font-size:13px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.38rem .75rem;border-radius:6px;cursor:pointer}
.top button{background:transparent;color:#fff;border-color:#ffffff55}.p{background:var(--pri)!important;border-color:var(--pri)!important;color:#fff!important}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:0 .8rem}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:.7rem 1rem;font-weight:600;color:var(--mut)}nav .on{color:var(--ink);border-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:1.1rem}
h2{font:700 24px 'Barlow Condensed',sans-serif;margin:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin:.2rem 0 .8rem;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem;margin-bottom:1rem}
.st{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);padding:.6rem .9rem;border-radius:6px}.st.r{border-left-color:var(--pri)}.st.o{border-left-color:var(--ok)}
.st b{display:block;font:700 32px/1.1 'Barlow Condensed',sans-serif}.st span{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem;margin-bottom:.7rem}
.card header{display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap}.card header button{margin-left:auto}.card p{margin:.3rem 0;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:.3rem 0}.chips i{font-style:normal;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:13px}small,.note{color:var(--mut);font-size:13px}
.al{display:flex;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--line)}.al span{flex:1}
.cl{margin:.5rem 0}.cl div{display:flex;justify-content:space-between;font-size:14px}.cl u{display:block;height:8px;background:var(--navy);border-radius:4px;margin-top:3px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:.5rem .7rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:13px}
.act button{padding:.15rem .5rem;font-size:13px;margin-right:3px}
.b{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--mut);white-space:nowrap}.b.r{background:var(--br);color:var(--red)}.b.a{background:var(--ba);color:var(--amb)}.b.o{background:var(--bo);color:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.8rem}.tabs .on{background:var(--navy);color:#fff;border-color:var(--navy)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#0008}
dialog h2{margin-bottom:.4rem}dialog label{display:block;margin:.5rem 0;font-size:13px;color:var(--mut)}
input,select{width:100%;font:inherit;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
fieldset{border:1px solid var(--line);border-radius:6px;margin:.6rem 0}.chk{display:grid;grid-template-columns:1fr 1fr;gap:2px}.chk label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)}.chk input{width:auto}
.row{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.8rem}#qrb{display:grid;place-items:center;padding:.8rem;background:#fff;border-radius:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:.5rem 1rem;border-radius:8px;display:none;max-width:90vw}
.empty{padding:1.5rem;text-align:center}
</style></head><body>

function alerts(){const o=[];['mat','era','far','inv'].forEach(k=>{const t=T[k];S[k].forEach(r=>{const n=r.desc||r.nom;t.c.forEach(([f,l,ty])=>{if(ty==='d'){const v=venc(r[f]);if(v[1]&&v[1]!=='o')o.push([v[1],n+' · '+l,v[0]])}});if(r.min!==undefined&&r.stock<r.min)o.push(['r',n+' · stock '+r.stock+' de mínimo '+r.min,'Reponer'])})});S.epp.forEach(r=>{if(r.estado==='Malo'||r.estado==='En reparación')o.push(['r',r.equipo+' · '+r.nombre,r.estado])});S.car.forEach(r=>{if(/no tiene/i.test(r.obs))o.push(['r',r.comp+' · no tiene','Falta'])});return o.sort((a,b)=>a[0]>b[0]?-1:1)}
function rRes(){const A=S.per.filter(p=>p.estado==='Activo'),av=L=>A.length?Math.round(A.reduce((s,p)=>s+pct(p.run,L),0)/A.length):0,ae=av(S.act),ac=av(S.cit),al=alerts(),m={};
S.act.forEach(a=>{const c=code(a.clave);(m[c]??={a:0,p:0}).a++;m[c].p+=a.run.length});const e=Object.entries(m).sort((a,b)=>b[1].a-a[1].a),mx=Math.max(1,...e.map(x=>x[1].a));
return `<div class="stats"><div class="st"><b>${A.length}</b><span>Voluntarios activos</span></div><div class="st ${ae>=30?'o':'r'}"><b>${ae}%</b><span>Asistencia a emergencias (norma 30%)</span></div><div class="st ${ac>=30?'o':'r'}"><b>${ac}%</b><span>Asistencia a citaciones (norma 30%)</span></div><div class="st"><b>${A.filter(p=>p.nivel==='Operativo').length} / ${A.filter(p=>p.nivel==='Inicial').length}</b><span>Nivel operativo / inicial</span></div><div class="st ${al.length?'r':'o'}"><b>${al.length}</b><span>Alertas de material</span></div></div>
<div class="two"><section class="card"><h2>Alertas de material</h2>${al.map(a=>`<div class="al"><span>${esc(a[1])}</span>${badge([a[2],a[0]])}</div>`).join('')||'<p class="empty">Sin alertas: todo el material está al día.</p>'}</section>
<section class="card"><h2>Actos por clave radial</h2>${e.map(([c,v])=>`<div class="cl"><div><span>${c} ${CN[c]||''}</span><span>${v.a} actos · ${v.p} asistencias</span></div><u style="width:${100*v.a/mx}%"></u></div>`).join('')||'<p class="empty">Aún no hay actos registrados.</p>'}</section></div>
<p class="note">El % de asistencia es: actos a los que asistió ÷ actos registrados en la bitácora (${S.act.length} emergencias, ${S.cit.length} citaciones).</p>`}
function table(k){const t=T[k],L=S[k];return `<div class="scroll"><table><thead><tr>${t.c.map(c=>`<th>${c[1]}</th>`).join('')}${(t.x||[]).map(x=>`<th>${x[0]}</th>`).join('')}<th></th></tr></thead><tbody>${L.map((r,i)=>`<tr>${t.c.map(([f,l,ty])=>`<td>${ty==='d'?fd(r[f])+' '+badge(venc(r[f])):ty==='f'?fd(r[f]):esc(r[f])}</td>`).join('')}${(t.x||[]).map(x=>`<td>${x[1](r)}</td>`).join('')}<td class="act">${t.qr?`<button data-qr="${k}:${i}">QR</button>`:''}<button data-ed="${k}:${i}">Editar</button><button data-del="${k}:${i}">Borrar</button></td></tr>`).join('')||`<tr><td class="empty" colspan="12">Sin registros.</td></tr>`}</tbody></table></div>`}
const rPer=()=>`<div class="bar"><h2>Voluntarios</h2><button class="p" data-new="per">Agregar voluntario</button></div>`+table('per');
function rAct(k){const e=k==='act',L=S[k].map((a,i)=>[a,i]).sort((x,y)=>y[0].fecha.localeCompare(x[0].fecha)),N=S.per.filter(p=>p.estado==='Activo').length||1;
return `<div class="bar"><h2>${e?'Bitácora de emergencias':'Asistencia a citaciones'}</h2><button class="p" data-new="${k}">${e?'Registrar acto':'Registrar citación'}</button></div>`+(L.map(([a,i])=>`<article class="card"><header><b>${e?'Acto':'Cita'} ${esc(a.n)}</b><span>${fd(a.fecha)}</span><strong>${esc(e?a.clave:a.tipo)}</strong><button data-del="${k}:${i}">Borrar</button></header><p>${esc(e?[a.lugar,a.oficial,a.uni].filter(Boolean).join(', '):a.tema)}</p><div class="chips">${a.run.map(r=>`<i>${esc(nm(r))}</i>`).join('')}</div><small>${a.run.length} asistentes, ${Math.round(100*a.run.length/N)}% de los voluntarios activos</small></article>`).join('')||'<p class="empty">Aún no hay registros. Usa el botón de arriba para agregar el primero.</p>')}
const rInv=()=>`<div class="tabs">${['mat','era','far','inv','car'].map(k=>`<button data-sub="${k}" class="${k===SUB?'on':''}">${T[k].t}</button>`).join('')}</div><div class="bar"><h2>${T[SUB].t}</h2><button class="p" data-new="${SUB}">Agregar ítem</button></div>`+table(SUB)+`<p class="note">Las alertas se calculan con la fecha de hoy: vencido, por vencer (60 días) y stock bajo el mínimo. El botón QR genera el código del equipo.</p>`;
const EQ=['Equipo estructural','Equipo forestal','Linterna','Radio portátil'],ES=['Bueno','Regular','Malo','En reparación'];
const eb=e=>badge([e,e==='Bueno'?'o':e==='Regular'?'a':'r']);
function rEpp(){const A=S.per.filter(p=>p.estado==='Activo'),got=(r,e)=>S.epp.find(a=>a.run===r&&a.equipo===e);
return `<div class="bar"><h2>Equipo de protección personal</h2><button class="p" data-new="epp">Registrar entrega</button></div><div class="scroll"><table><thead><tr><th>Voluntario</th>${EQ.map(e=>`<th>${e}</th>`).join('')}</tr></thead><tbody>${A.map(p=>`<tr><td>${esc(short(p.nombre))}</td>${EQ.map(e=>{const a=got(p.run,e);return `<td><button data-cell="${p.run}|${e}">${a?eb(a.estado):'<span class="b">Sin entregar</span>'}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="note">Toca una casilla para registrar la entrega o cambiar el estado del equipo.</p><h2 style="margin:1rem 0 .5rem">Detalle de entregas</h2>`+table('epp')}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===V));$('#main').innerHTML=({res:rRes,per:rPer,act:()=>rAct('act'),cit:()=>rAct('cit'),epp:rEpp,inv:rInv})[V]()}
function form(title,fs,cb){const d=$('#dlg');d.innerHTML=`<form method="dialog"><h2>${title}</h2>`+fs.map(f=>f.t==='chk'?`<fieldset><legend>${f.l}</legend><div class="chk">${S.per.map(p=>`<label><input type="checkbox" name="${f.k}" value="${p.run}">${esc(short(p.nombre))}</label>`).join('')}</div></fieldset>`:`<label>${f.l}${f.t==='sel'?`<select name="${f.k}">${f.o.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===f.v?' selected':''}>${esc(l)}</option>`}).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.r?'required':''}>`}</label>`).join('')+`<div class="row"><button value="c" formnovalidate>Cancelar</button><button value="ok" class="p">Guardar</button></div></form>`;
d.onclose=()=>{if(d.returnValue!=='ok')return;const fm=new FormData(d.querySelector('form')),o={};fs.forEach(f=>{o[f.k]=f.t==='chk'?fm.getAll(f.k):f.t==='number'?Number(fm.get(f.k)):fm.get(f.k)});d.returnValue='';cb(o)};d.showModal()}
const FS={act:()=>[{k:'n',l:'N° de acto',v:nextN(S.act,''),r:1},{k:'fecha',l:'Fecha',t:'date',r:1},{k:'clave',l:'Clave radial (ej. 10-0 Incendio en vivienda)',r:1},{k:'lugar',l:'Dirección / ubicación'},{k:'uni',l:'Unidades concurrentes',v:'B6'},{k:'oficial',l:'Oficial a cargo',t:'sel',o:['CAPITAN','TENIENTE 1RO','TENIENTE 2DO','DIRECTOR']},{k:'run',l:'Voluntarios asistentes',t:'chk'}],
cit:()=>[{k:'n',l:'N° de citación',v:nextN(S.cit,'C-'),r:1},{k:'fecha',l:'Fecha',t:'date',r:1},{k:'tipo',l:'Tipo de acto',r:1},{k:'tema',l:'Tema / detalle'},{k:'run',l:'Voluntarios asistentes',t:'chk'}]};
FS.epp=()=>[{k:'fecha',l:'Fecha de entrega',t:'date',r:1,v:new Date().toISOString().slice(0,10)},{k:'run',l:'Voluntario',t:'sel',o:S.per.map(p=>[p.run,short(p.nombre)])},{k:'equipo',l:'Equipo entregado',t:'sel',o:EQ},{k:'marca',l:'Marca / modelo'},{k:'serie',l:'N° de serie'},{k:'estado',l:'Estado',t:'sel',o:ES}];
function edit(k,i,pre){const nw=i===undefined,cur=nw?(pre||{}):S[k][i],fs=(FS[k]?FS[k]():T[k].c.map(([f,l,ty],j)=>({k:f,l,r:j===0,t:ty==='n'?'number':ty?'date':'text'}))).map(f=>({...f,v:cur[f.k]??f.v??''}));
form((nw?'Agregar':'Editar')+' · '+(T[k]?T[k].t:k==='act'?'acto':'citación'),fs,o=>{if(k==='epp')o.nombre=(S.per.find(p=>p.run===o.run)||{}).nombre||'';nw?S[k].push(o):Object.assign(S[k][i],o);save();render()})}
function qr(k,i){const t=T[k],r=S[k][i],tx=(k==='epp'?['Cía 6 Tomé',r.equipo,r.nombre,r.serie&&'Serie '+r.serie]:['Cía 6 Tomé',r[t.c[0][0]],r.desc||r.tipo||'',r.ubi||'']).filter(Boolean).join(' | '),d=$('#dlg');d.onclose=null;d.innerHTML=`<h2>Código QR</h2><div id="qrb"></div><p>${esc(tx)}</p><form method="dialog"><div class="row"><button>Cerrar</button></div></form>`;d.showModal();try{new QRCode($('#qrb'),{text:tx,width:220,height:220})}catch(e){$('#qrb').textContent='No se pudo generar el QR'}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const g=a=>(b.dataset[a]||'').split(':'),v=b.dataset.v;
if(v){V=v;render()}else if(b.dataset.sub){SUB=b.dataset.sub;render()}else if(b.dataset.new)edit(b.dataset.new);else if(b.dataset.ed){const[k,i]=g('ed');edit(k,+i)}else if(b.dataset.qr){const[k,i]=g('qr');qr(k,+i)}
else if(b.dataset.del){if(b.dataset.arm){const[k,i]=g('del');S[k].splice(+i,1);save();render()}else{b.dataset.arm=1;b.textContent='¿Seguro?';setTimeout(()=>{delete b.dataset.arm;b.textContent='Borrar'},3000)}}
else if(b.dataset.cell){const[r,e]=b.dataset.cell.split('|'),i=S.epp.findIndex(a=>a.run===r&&a.equipo===e);i>=0?edit('epp',i):edit('epp',undefined,{run:r,equipo:e})}
else if(b.id==='rst'){if(b.dataset.arm){S=structuredClone(D0);save();render();toast('Datos restablecidos');delete b.dataset.arm;b.textContent='Restablecer datos'}else{b.dataset.arm=1;b.textContent='¿Borrar cambios?';setTimeout(()=>{delete b.dataset.arm;b.textContent='Restablecer datos'},3000)}}
else if(b.id==='imp')$('#file').click();else if(b.id==='exp')exportar()});
const fx=d=>fd(d).replaceAll('-','/');
async function exportar(){const dl=await(window.claude?.use?.('downloads'));
const wb=XLSX.utils.book_new(),add=(r,n)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n);
Object.values(T).forEach(t=>add(S[Object.keys(T).find(k=>T[k]===t)].map(r=>Object.fromEntries(t.c.map(([f,l,ty])=>[l,ty==='d'||ty==='f'?fx(r[f]):r[f]]))),t.s));
const ar=(L,C)=>L.flatMap(a=>(a.run.length?a.run:['']).map(r=>({...Object.fromEntries(Object.entries(C).map(([k,h])=>[h,k==='run'?r:k==='fecha'?fx(a.fecha):a[k]])),Voluntario:r?nm(r):''})));
add(ar(S.act,AC),'Bitácora Emergencias');add(ar(S.cit,CC),'Asistencia Citaciones');
try{const bin=XLSX.write(wb,{type:'array',bookType:'xlsx'}),F='gestion-bomberos-6ta.xlsx';if(dl)await dl.save({filename:F,data:bin});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bin]));a.download=F;a.click()}toast('Excel exportado')}catch(e){if(e.code!=='declined')toast('No se pudo exportar el archivo.')}}
const dI=v=>{if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);v=String(v||'');let m=v.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):/^\d{4}-\d\d-\d\d/.test(v)?v.slice(0,10):''};
const mr=s=>{const c=String(s).replace(/[^0-9Kk]/g,'').toUpperCase(),p=S.per.find(p=>c.startsWith(p.run.replace(/[.\-]/g,'').slice(0,-1)));return p&&p.run};
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),N=structuredClone(S),got=[];
['per','mat','era','far','inv','car','epp'].forEach(k=>{const t=T[k],ws=wb.Sheets[t.s];if(!ws)return;N[k]=XLSX.utils.sheet_to_json(ws,{defval:''}).filter(r=>String(r[t.c[0][1]]).trim()!=='').map(r=>Object.fromEntries(t.c.map(([f,l,ty])=>[f,ty==='d'||ty==='f'?dI(r[l]):ty==='n'?(Number(r[l])||0):String(r[l]).trim()])));got.push(N[k].length+' '+t.t.toLowerCase())});
const keep=S;S=N;
const grp=(sn,C)=>{const ws=wb.Sheets[sn];if(!ws)return null;const m={};XLSX.utils.sheet_to_json(ws,{defval:''}).forEach(r=>{const n=String(r[C.n]).trim();if(!n)return;const o=m[n]??={n,run:[],...Object.fromEntries(Object.keys(C).filter(k=>k!=='n'&&k!=='run').map(k=>[k,k==='fecha'?dI(r[C[k]]):r[C[k]]]))};if(!o.fecha)o.fecha=dI(r[C.fecha]);const x=mr(r[C.run]);if(x&&!o.run.includes(x))o.run.push(x)});return Object.values(m)};
const a=grp('Bitácora Emergencias',AC),c=grp('Asistencia Citaciones',CC);if(a){N.act=a;got.push(a.length+' emergencias')}if(c){N.cit=c;got.push(c.length+' citaciones')}
if(!got.length){S=keep;return toast('El archivo no tiene las hojas esperadas.')}S=N;save();render();toast('Importado: '+got.join(', '))}catch(x){toast('No se pudo leer el archivo Excel.')}};
render();
</script></body></html>
